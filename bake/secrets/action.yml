name: Bake secrets
description: >-
  Internal to .github/workflows/bake.yml. Masks the build secrets and exports them as environment variables.

inputs:
  secrets:
    description: Build secrets as "NAME=value" lines.
    required: false

runs:
  using: composite
  steps:
    - name: Export the build secrets
      shell: bash
      env:
        BUILD_SECRETS: ${{ inputs.secrets }}
      run: bash "$GITHUB_ACTION_PATH/secrets.sh"
