name: Merge images to manifest

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner name i.e. default runner "ubuntu-24.04"
        type: string
        required: true
      image-name:
        description: Image name
        type: string
        required: true
      target:
        description: Name of the dockerfile target the digests were built from.
        type: string
        required: false
      title:
        description: Custom image title (overrides repository name)
        type: string
        required: false
      description:
        description: Custom image description (overrides repository description)
        type: string
        required: false
      raw-tag:
        description: Raw tag value
        type: string
        default: latest
      raw-tags:
        description: Additional metadata-action tag directives (multiline), forwarded to create-manifest
        type: string
        required: false
      flavor:
        description: metadata-action flavor directives (multiline), forwarded to create-manifest
        type: string
        required: false
      version:
        description: Value for org.opencontainers.image.version
        type: string
        required: false
      push:
        description: >-
          Create and push the manifest ("true"/"false"). Must match the build's push. Defaults to
          pushing, except for dependabot.
        type: string
        required: false

jobs:
  merge:
    name: Merge Images${{ inputs.target && format(' ({0})', inputs.target) || '' }}
    runs-on: ${{ inputs.runs-on }}
    # Skipped per step rather than per job: a job skipped by its `if` reports under its raw,
    # unevaluated name, so it never satisfies a required "Merge Images" check.
    env:
      PUSH: ${{ inputs.push || github.actor != 'dependabot[bot]' }}
    steps:

      - name: Skip merge
        if: ${{ env.PUSH != 'true' }}
        run: echo "::notice::The images were built without pushing, so there are no digests to merge."

      - name: Checkout
        if: ${{ env.PUSH == 'true' }}
        uses: actions/checkout@v7

      - name: Image name
        id: image_name
        if: ${{ env.PUSH == 'true' }}
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ inputs.image-name }}

      - name: Log in to the Container registry
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ env.PUSH == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Create Manifest
        if: ${{ env.PUSH == 'true' }}
        uses: specsnl/github-actions/create-manifest@2.4.4
        with:
          image-name: ${{ steps.image_name.outputs.lowercase }}
          target: ${{ inputs.target }}
          raw-tags: ${{ inputs.raw-tags }}
          flavor: ${{ inputs.flavor }}
          raw-tag: ${{ inputs.raw-tag }}
          version: ${{ inputs.version }}
          title: ${{ inputs.title }}
          description: ${{ inputs.description }}
