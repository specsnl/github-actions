name: Test bake.yml

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: Push the test images to ghcr.io/specsnl/github-actions/e2e
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  bake:
    name: Bake
    uses: $/.github/workflows/bake.yml
    permissions:
      contents: read
      packages: write
    with:
      files: bake/test/e2e/docker-bake.hcl
      push: ${{ inputs.push && 'true' || 'false' }}
    secrets:
      build-secrets: E2E_SECRET=e2e-secret

  load:
    name: Load
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VERSION: ci
        with:
          source: .
          files: |
            bake/specs.hcl
            bake/test/e2e/docker-bake.hcl
          targets: cli-debian
          load: true
          set: '*.platform=linux/amd64'

      - name: Run
        run: test "$(docker run --rm ghcr.io/specsnl/github-actions/e2e-cli:local)" = "debian ci"

  reproducible:
    name: Reproducible
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build twice without cache and compare the digests
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          CREATED=$(TZ=UTC printf '%(%Y-%m-%dT%H:%M:%SZ)T' "$SOURCE_DATE_EPOCH")
          export SOURCE_DATE_EPOCH CREATED

          for build in 1 2; do
            docker buildx bake --no-cache --progress=quiet \
              -f bake/specs.hcl -f bake/test/e2e/docker-bake.hcl cli-debian \
              --set '*.platform=linux/amd64' \
              --set '*.output=type=image,name=e2e-repro,push=false,oci-mediatypes=true,rewrite-timestamp=true' \
              --metadata-file "$RUNNER_TEMP/build-$build.json"
            jq -r '."cli-debian"["containerimage.digest"]' "$RUNNER_TEMP/build-$build.json" | tee "$RUNNER_TEMP/digest-$build"
          done

          if ! cmp -s "$RUNNER_TEMP/digest-1" "$RUNNER_TEMP/digest-2"; then
            echo "::error::Two builds of the same commit produced different images."
            exit 1
          fi
