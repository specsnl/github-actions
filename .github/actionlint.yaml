# actionlint 1.7.12 predates these GitHub-hosted runner labels.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint 1.7.12 doesn't know GitHub's "$/" self-repository syntax yet: rhysd/actionlint#711
      - 'reusable workflow call "\$/.+" at "uses" is not following the format'
      - 'specifying action "\$/.+" in invalid format because ref is missing'
