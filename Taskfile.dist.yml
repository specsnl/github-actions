version: "3"

silent: true

vars:
  ACTIONLINT_TAG_VERSION: "1.7.12"

tasks:
  lint:
    desc: Lint GitHub Actions workflow files using actionlint
    cmd: docker run --rm
      --volume "{{.ROOT_DIR}}:/workdir"
      --workdir /workdir
      rhysd/actionlint:{{.ACTIONLINT_TAG_VERSION}}

  test:
    desc: Run the bake/specs.hcl fixture tests
    cmd: bake/test/run.sh

  test:update:
    desc: Rewrite the expected output of the bake/specs.hcl fixture tests
    cmd: bake/test/run.sh --update
