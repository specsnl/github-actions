name: Bake

on:
  workflow_call:
    inputs:
      files:
        description: The consumer's bake files (multiline), read after specs-file.
        type: string
        default: docker-bake.hcl
      specs-file:
        description: >-
          Path of the vendored copy of bake/specs.hcl. Read first, and compared with the copy this version of the
          workflow expects. Set to an empty string if the bake files don't use it.
        type: string
        default: specs.hcl
      targets:
        description: Bake targets or groups to build (multiline). Defaults to the "default" group.
        type: string
        required: false
      version:
        description: >-
          The VERSION bake variable. Defaults to the tag without its leading "v" on a tag push, "pr-<number>" on a
          pull request, the branch name on a branch push, "nightly" on a schedule and the dispatch tag on
          workflow_dispatch.
        type: string
        required: false
      dispatch-tag:
        description: Tag published by a workflow_dispatch run. Lowercased.
        type: string
        default: latest
      push:
        description: >-
          "true" or "false". Defaults to pushing, except for pull requests from dependabot or from a fork, pushes to
          a dependabot branch, and events the tag rules don't cover.
        type: string
        required: false
      runners:
        description: >-
          JSON object mapping a platform to its runner, merged over the default
          {"linux/amd64": "ubuntu-26.04", "linux/arm64": "ubuntu-26.04-arm"}.
        type: string
        required: false
      disable-apparmor:
        description: Disable AppArmor on the build runners before building.
        type: boolean
        default: false
      timeout-minutes:
        description: Timeout of each build job.
        type: number
        default: 60
    secrets:
      build-secrets:
        description: >-
          Build secrets as "NAME=value" lines. Each one is masked and exported as an environment variable to the
          build, where the bake file refers to it with secret = ["id=<id>,env=NAME"].
        required: false
    outputs:
      version:
        description: The VERSION the images were built with.
        value: ${{ jobs.plan.outputs.version }}
      push:
        description: Whether the images were pushed ("true" or "false").
        value: ${{ jobs.plan.outputs.push }}

permissions: {}

jobs:

  plan:
    name: Plan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      push: ${{ steps.vars.outputs.push }}
      matrix: ${{ steps.freeze.outputs.matrix }}
      artifact: ${{ steps.freeze.outputs.artifact }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the run's variables
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DISPATCH_TAG: ${{ inputs.dispatch-tag }}
          INPUT_PUSH: ${{ inputs.push }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          dispatch_tag="${INPUT_DISPATCH_TAG,,}"
          dispatch_tag="${dispatch_tag:-latest}"

          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            case "$GITHUB_EVENT_NAME" in
              push)
                version="$GITHUB_REF_NAME"
                if [ "$GITHUB_REF_TYPE" = tag ] && [[ $version =~ ^v[0-9] ]]; then
                  version="${version#v}"
                fi
                ;;
              pull_request | pull_request_target) version="pr-$PR_NUMBER" ;;
              schedule) version=nightly ;;
              workflow_dispatch) version="$dispatch_tag" ;;
            esac
          fi

          is_stable=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ] && [[ $version != *-* ]]; then
            is_stable=true
          fi

          push="$INPUT_PUSH"
          if [ -z "$push" ]; then
            push=true
            case "$GITHUB_EVENT_NAME" in
              pull_request | pull_request_target)
                if [ "$PR_AUTHOR" = 'dependabot[bot]' ] || [ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
                  push=false
                fi
                ;;
              push)
                if [ "$GITHUB_REF_TYPE" = branch ] && [[ $GITHUB_REF_NAME == dependabot/* ]]; then
                  push=false
                fi
                ;;
              schedule | workflow_dispatch) ;;
              *) push=false ;;
            esac
          fi
          if [ "$push" != true ] && [ "$push" != false ]; then
            echo "::error::push must be \"true\" or \"false\", got \"$push\"."
            exit 1
          fi

          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "version<<$delimiter"
            echo "$version"
            echo "$delimiter"
            echo "dispatch-tag<<$delimiter"
            echo "$dispatch_tag"
            echo "$delimiter"
            echo "is-stable=$is_stable"
            echo "push=$push"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Compare specs.hcl
        if: ${{ inputs.specs-file != '' }}
        env:
          SPECS_FILE: ${{ inputs.specs-file }}
          SPECS_HCL_SHA256: 614358730448525dc70538f509930a0e0c85b21f0d6d8f04016ac1089797d4c8
        run: |
          if [ ! -f "$SPECS_FILE" ]; then
            echo "::error::$SPECS_FILE not found. Copy bake/specs.hcl from specsnl/github-actions at the version of bake.yml you use, or set specs-file to an empty string."
            exit 1
          fi
          actual=$(sha256sum "$SPECS_FILE" | cut -d' ' -f1)
          if [ "$actual" != "$SPECS_HCL_SHA256" ]; then
            echo "::warning file=$SPECS_FILE::$SPECS_FILE differs from bake/specs.hcl at the version of bake.yml you use. Copy that file over it."
          fi

      - name: Read the repository
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/repository.json"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "name<<$delimiter"
            jq -r '.name' "$RUNNER_TEMP/repository.json"
            echo "$delimiter"
            echo "description<<$delimiter"
            jq -r '.description // ""' "$RUNNER_TEMP/repository.json"
            echo "$delimiter"
            echo "license=$(jq -r '.license.spdx_id // "" | select(. != "NOASSERTION")' "$RUNNER_TEMP/repository.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Freeze the bake definition
        id: freeze
        env:
          FILES: ${{ inputs.files }}
          SPECS_FILE: ${{ inputs.specs-file }}
          TARGETS: ${{ inputs.targets }}
          RUNNERS: ${{ inputs.runners }}
          PUSH: ${{ steps.vars.outputs.push }}
          VERSION: ${{ steps.vars.outputs.version }}
          DISPATCH_TAG: ${{ steps.vars.outputs.dispatch-tag }}
          IS_STABLE: ${{ steps.vars.outputs.is-stable }}
          CREATED: ${{ steps.vars.outputs.created }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REPOSITORY_NAME: ${{ steps.repository.outputs.name }}
          REPOSITORY_DESCRIPTION: ${{ steps.repository.outputs.description }}
          LICENSES: ${{ steps.repository.outputs.license }}
        run: |
          trim() { sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d'; }

          files=()
          while IFS= read -r file; do files+=(-f "$file"); done < <(printf '%s\n%s\n' "$SPECS_FILE" "$FILES" | trim)
          mapfile -t targets < <(printf '%s\n' "$TARGETS" | trim)

          dir="$RUNNER_TEMP/bake"
          mkdir -p "$dir"
          docker buildx bake --progress=quiet "${files[@]}" --print "${targets[@]}" > "$dir/print.json"
          if jq -e '(.target // {}) == {}' "$dir/print.json" > /dev/null; then
            echo "::error::The bake files define no targets to build."
            exit 1
          fi

          jq --arg push "$PUSH" '
            def image: .tags[0] | sub(":[^:/]*$"; "");
            .target |= with_entries(
              if (.value.platforms // []) == [] then
                error("target \(.key) has no platforms; set platforms in the bake file")
              elif $push == "true" and (.value.tags // []) == [] then
                error("target \(.key) has no tags for this event, so there is nothing to push")
              else . end
            )
            | .target |= map_values(
                (if $push == "true" then
                  "type=image,name=\(image),push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=true"
                else
                  "type=cacheonly"
                end) as $output
                | del(.tags, .output, .["cache-from"], .["cache-to"], .load, .push)
                | .output = [$output]
              )
            | .group = {default: {targets: (.target | keys)}}
          ' "$dir/print.json" > "$dir/definition.json"

          jq '
            .target | map_values({
              image: (.tags[0] // "" | sub(":[^:/]*$"; "")),
              tags: (.tags // []),
              labels: (.labels // {}),
              platforms
            })
          ' "$dir/print.json" > "$dir/publish.json"

          jq --argjson override "${RUNNERS:-"{}"}" '
            ({"linux/amd64": "ubuntu-26.04", "linux/arm64": "ubuntu-26.04-arm"} + $override) as $runners
            | [.target[].platforms[]] | unique
            | map({
                platform: .,
                slug: gsub("[^A-Za-z0-9]+"; "-"),
                runner: ($runners[.] // error("no runner for platform \(.); add it to the runners input"))
              })
          ' "$dir/print.json" > "$dir/matrix.json"

          echo "matrix=$(jq -c . "$dir/matrix.json")" >> "$GITHUB_OUTPUT"
          # Unique per call, so a caller can use this workflow more than once in a run.
          echo "artifact=bake-$(printf '%s\n' "$SPECS_FILE" "$FILES" "$TARGETS" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

          {
            echo '### Bake definition'
            echo
            echo "Version \`$VERSION\`, push \`$PUSH\`."
            echo
            echo '| Target | Platforms | Tags |'
            echo '|--------|-----------|------|'
            jq -r 'to_entries[] | "| `\(.key)` | \(.value.platforms | join(", ")) | \(.value.tags | map("`\(.)`") | join("<br>")) |"' "$dir/publish.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bake definition
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.freeze.outputs.artifact }}-definition
          path: |
            ${{ runner.temp }}/bake/definition.json
            ${{ runner.temp }}/bake/publish.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the bake definition
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}-definition
          path: ${{ runner.temp }}/bake

      - name: Narrow the definition to ${{ matrix.platform }}
        id: definition
        env:
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
        run: |
          dir="$RUNNER_TEMP/bake"
          jq --arg platform "$PLATFORM" --arg slug "$SLUG" --slurpfile publish "$dir/publish.json" '
            .target |= with_entries(
              select(.value.platforms | index($platform))
              | ("\($publish[0][.key].image | gsub("[^A-Za-z0-9]+"; "-"))-\(.key)-\($slug)") as $scope
              | .value.platforms = [$platform]
              | .value["cache-from"] = ["type=gha,scope=\($scope)"]
              | .value["cache-to"] = ["type=gha,mode=max,scope=\($scope)"]
            )
            | .group = {default: {targets: (.target | keys)}}
          ' "$dir/definition.json" > "$dir/definition-$SLUG.json"
          echo "file=$dir/definition-$SLUG.json" >> "$GITHUB_OUTPUT"

      - name: Export the build secrets
        env:
          BUILD_SECRETS: ${{ secrets.build-secrets }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "${line//[[:space:]]/}" ] && continue
            name="${line%%=*}"
            value="${line#*=}"
            if [ "$name" = "$line" ] || [[ ! $name =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::Every line of build-secrets must be NAME=value, with a NAME of letters, digits and underscores."
              exit 1
            fi
            case "$name" in
              GITHUB_* | RUNNER_* | ACTIONS_* | BUILDX_* | DOCKER_* | PATH | HOME | BASH_ENV | ENV | NODE_OPTIONS | LD_*)
                echo "::error::build-secrets may not set $name."
                exit 1
                ;;
            esac
            [ -n "$value" ] && echo "::add-mask::$value"
            delimiter="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done <<< "$BUILD_SECRETS"

      - name: Log in to the Container registry
        if: ${{ needs.plan.outputs.push == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable AppArmor
        if: ${{ inputs.disable-apparmor }}
        uses: cisagov/action-disable-apparmor@437d94f26a2e4bf8c03acfb500a6afc688b497db # v1.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        with:
          source: .
          files: ${{ steps.definition.outputs.file }}

      - name: Export the digests
        if: ${{ needs.plan.outputs.push == 'true' }}
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          SLUG: ${{ matrix.slug }}
        run: |
          dir="$RUNNER_TEMP/digests"
          mkdir -p "$dir"
          jq '
            with_entries(select(.value | type == "object"))
            | map_values(.["containerimage.digest"] // error("no digest in the build metadata"))
          ' <<< "$METADATA" > "$dir/digests-$SLUG.json"
          cat "$dir/digests-$SLUG.json"

      - name: Upload the digests
        if: ${{ needs.plan.outputs.push == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}-digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/digests-${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [plan, build]
    if: ${{ needs.plan.outputs.push == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:

      - name: Download the bake definition
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}-definition
          path: ${{ runner.temp }}/bake

      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.plan.outputs.artifact }}-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifests
        run: |
          publish="$RUNNER_TEMP/bake/publish.json"
          digests=$(jq -s 'map(to_entries) | add | group_by(.key) | map({key: .[0].key, value: map(.value)}) | from_entries' "$RUNNER_TEMP"/digests/digests-*.json)

          for target in $(jq -r 'keys[]' "$publish"); do
            image=$(jq -r --arg t "$target" '.[$t].image' "$publish")
            mapfile -t tags < <(jq -r --arg t "$target" '.[$t].tags[]' "$publish")
            mapfile -t annotations < <(jq -r --arg t "$target" '
              .[$t].labels | to_entries[] | "index:\(.key)=\(.value)", "manifest-descriptor:\(.key)=\(.value)"
            ' "$publish")
            mapfile -t sources < <(jq -r --arg t "$target" --arg image "$image" '(.[$t] // [])[] | "\($image)@\(.)"' <<< "$digests")

            expected=$(jq -r --arg t "$target" '.[$t].platforms | length' "$publish")
            if [ "${#sources[@]}" -ne "$expected" ]; then
              echo "::error::$target has ${#sources[@]} digests for $expected platforms."
              exit 1
            fi

            args=()
            for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
            for annotation in "${annotations[@]}"; do args+=(--annotation "$annotation"); done

            echo "::group::$target"
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
            docker buildx imagetools inspect "${tags[0]}"
            echo "::endgroup::"
          done

  status:
    name: Image
    needs: [plan, build, publish]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '.plan.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
