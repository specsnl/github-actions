version: "3"

silent: true

vars:
  ACTIONLINT_TAG_VERSION: "1.7.12"

tasks:
  lint:
    desc: Lint GitHub Actions workflow files using actionlint
    cmd: docker run --rm
      --volume "{{.ROOT_DIR}}:/workdir"
      --workdir /workdir
      rhysd/actionlint:{{.ACTIONLINT_TAG_VERSION}}

  test:
    desc: Run the bake/specs.hcl fixture tests and the bake.yml plan job tests
    cmds:
      - bake/test/run.sh
      - bake/test/plan.sh
      - bake/test/specs-hash.sh

  test:update:
    desc: Rewrite the expected output of the specs.hcl fixture tests, and bake.yml's SPECS_HCL_SHA256
    cmds:
      - bake/test/run.sh --update
      - bake/test/specs-hash.sh --update
