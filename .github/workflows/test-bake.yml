name: Test bake.yml

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: Push the test images to ghcr.io/specsnl/github-actions/e2e
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  bake:
    name: Bake
    uses: $/.github/workflows/bake.yml
    permissions:
      contents: read
      packages: write
    with:
      files: bake/test/e2e/docker-bake.hcl
      # Empty outside workflow_dispatch, so bake.yml's own push rules apply: a pull request from this repository
      # pushes, one from a fork or dependabot doesn't.
      push: ${{ github.event_name == 'workflow_dispatch' && (inputs.push && 'true' || 'false') || '' }}
    secrets:
      build-secrets: E2E_SECRET=e2e-secret

  verify:
    name: Verify
    needs: bake
    if: ${{ needs.bake.outputs.push == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      packages: read
    steps:

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the published images
        env:
          IMAGE: ghcr.io/specsnl/github-actions/e2e
          VERSION: ${{ needs.bake.outputs.version }}
        run: |
          # check <reference> <platforms> <title>: the index has exactly these platforms and carries the labels.
          check() {
            local raw
            raw=$(docker buildx imagetools inspect --raw "$1")
            if ! jq -e --arg platforms "$2" --arg title "$3" --arg version "$VERSION" '
              ([.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")) == $platforms
              and .annotations["org.opencontainers.image.title"] == $title
              and .annotations["org.opencontainers.image.version"] == $version
            ' <<< "$raw" > /dev/null; then
              echo "::error::$1 doesn't have the expected platforms ($2) or annotations."
              jq . <<< "$raw"
              return 1
            fi
            echo "ok $1"
          }

          check "$IMAGE:$VERSION" 'linux/amd64 linux/arm64' 'e2e app'
          check "$IMAGE-cli:$VERSION" 'linux/amd64 linux/arm64' 'e2e cli'
          check "$IMAGE-cli:$VERSION-alpine" 'linux/amd64' 'e2e cli'

  load:
    name: Load
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VERSION: ci
        with:
          source: .
          files: |
            bake/specs.hcl
            bake/test/e2e/docker-bake.hcl
          targets: cli-debian
          load: true
          set: '*.platform=linux/amd64'

      - name: Run
        run: test "$(docker run --rm ghcr.io/specsnl/github-actions/e2e-cli:local)" = "debian ci"

  reproducible:
    name: Reproducible
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build twice without cache and compare the digests
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          CREATED=$(TZ=UTC printf '%(%Y-%m-%dT%H:%M:%SZ)T' "$SOURCE_DATE_EPOCH")
          export SOURCE_DATE_EPOCH CREATED

          for build in 1 2; do
            docker buildx bake --no-cache --progress=quiet \
              -f bake/specs.hcl -f bake/test/e2e/docker-bake.hcl cli-debian \
              --set '*.platform=linux/amd64' \
              --set '*.output=type=image,name=e2e-repro,push=false,oci-mediatypes=true,rewrite-timestamp=true' \
              --metadata-file "$RUNNER_TEMP/build-$build.json"
            jq -r '."cli-debian"["containerimage.digest"]' "$RUNNER_TEMP/build-$build.json" | tee "$RUNNER_TEMP/digest-$build"
          done

          if ! cmp -s "$RUNNER_TEMP/digest-1" "$RUNNER_TEMP/digest-2"; then
            echo "::error::Two builds of the same commit produced different images."
            exit 1
          fi
